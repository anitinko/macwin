name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      # rust-toolchain.toml pins 1.96.0; install it explicitly with the components CI needs.
      - name: Install Rust 1.96.0
        run: rustup toolchain install 1.96.0 --profile minimal -c rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Generated keymap is up to date
        run: cargo run -p keymap-gen --locked -- --check
      - name: Shell scripts parse
        shell: bash
        run: for f in scripts/*/*.sh; do bash -n "$f"; done
      # Windows PowerShell 5.1 (what install.ps1 runs on) reads files without
      # a BOM as ANSI, so the scripts stay ASCII.
      - name: PowerShell scripts parse (Windows PowerShell 5.1, ASCII)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts/windows/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name): $e"; $failed = $true }
            if ([IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }) {
              Write-Host "$($f.Name): non-ASCII bytes"; $failed = $true
            }
          }
          if ($failed) { exit 1 }

  # cargo-deny-action is a Docker action and only runs on Linux; deny.toml's
  # [graph] targets make it check the macOS and Windows dependency graphs.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          command: check
          rust-version: "1.96.0"
